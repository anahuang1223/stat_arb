data:
  universe:
    energy:      [XOM, CVX, COP, EOG, OXY]
    semis:       [NVDA, AMD, INTC, TXN, QCOM]
    defense:     [LMT, NOC, GD, RTX, LHX]
    nuclear:     [CCJ, UEC, DNN, URA, NLR]
    memory:      [MU, WDC, STX]
    silver:      [SLV, PAAS, WPM]
    gold:        [GLD, GDX, NEM]

  start_date: "2015-01-01"
  end_date:   "2025-12-31"

  train_end:  "2021-12-31"

  max_missing_frac: 0.05

  raw_dir: data/raw
  processed_dir: data/processed

pairs:
  fdr_alpha: 0.05
  min_half_life: 1
  max_half_life: 60

signals:
  zscore_window: 20
  entry_z: 2.0
  exit_z: 0.5
  stop_z: 4.0

robustness:
  missing_frac_grid: [0.01, 0.02, 0.05, 0.10]
